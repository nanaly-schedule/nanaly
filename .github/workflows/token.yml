name: CI - Update PR with Build Result

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'design'
    env:
      DEFAULT_TOKENS_FILE: src/init/styles/tokens.json
      STYLE_DICTIONARY_BUILD_PATH: src/init/styles/
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm auth token
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Style Dictionary output
        run: npm run build:tokens -- --input "$DEFAULT_TOKENS_FILE" --output "$STYLE_DICTIONARY_BUILD_PATH"

      - name: Commit build output to PR branch
        run: |
          if [[ -n "$(git status --porcelain -- src/init/styles/)" ]]; then
            git config user.name "Sleepingoff"
            git config user.email "justjh30@gmail.com"
            git add src/init/styles/
            git commit -m "design: 토큰 가공 결과"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No changes to commit"
          fi
